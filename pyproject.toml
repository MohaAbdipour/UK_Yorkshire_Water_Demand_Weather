[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-yorkshire-water-demand-weather"
version = "0.1.0"
description = "Daily Yorkshire water-demand forecasting from HadUK-Grid weather"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
